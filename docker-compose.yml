version: '3.8'

services:
  mongo:
    image: mongo:7.0
    container_name: agenttrace-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agenttrace-backend
    environment:
      MONGODB_URL: mongodb://mongo:27017
      DATABASE_NAME: agent_trace_db
      PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agenttrace-frontend
    ports:
      - "5174:5174"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongodb_data:
